
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starlink Satellite Data | Maxit</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#edf1f7;color:#172238}
header{background:#102b50;color:white;text-align:center;padding:28px 12px}
header h1{font-size:25px;margin:0}
header p{color:#ff9c32;font-weight:bold}
.container{max-width:760px;margin:25px auto;padding:12px}
.intro{text-align:center;margin-bottom:25px}
.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:white;padding:24px 16px;border-radius:13px;text-align:center;box-shadow:0 3px 12px #0001}
.card h2{font-size:19px}
.price{font-size:25px;font-weight:bold;color:#102b50;margin:18px}
.view{display:block;background:#ff941f;color:white;padding:14px;text-decoration:none;border-radius:7px;font-weight:bold}
footer{text-align:center;padding:25px;color:#667085}
</style>
</head>
<body>
<header>
<h1>STARLINK SATELLITE DATA</h1>
<p>POWERED BY MAXIT</p>
</header>

<div class="container">
<div class="intro">
<h2>Choose Your Data Package</h2>
<p>Select a package and tap View Details to continue.</p>
</div>

<div class="packages">
<div class="card">
<h2>5GB</h2>
<div class="price">LRD 300</div>
<a class="view" href="checkout.html?plan=5GB&price=300">VIEW DETAILS</a>
</div>

<div class="card">
<h2>Monthly Unlimited</h2>
<div class="price">LRD 500</div>
<a class="view" href="checkout.html?plan=Monthly%20Unlimited&price=500">VIEW DETAILS</a>
</div>

<div class="card">
<h2>5G Monthly Unlimited</h2>
<div class="price">LRD 700</div>
<a class="view" href="checkout.html?plan=5G%20Monthly%20Unlimited&price=700">VIEW DETAILS</a>
</div>
</div>
</div>

<footer>
STARLINK SATELLITE DATA<br>
Powered by MAXIT
</footer>
</body>
</html>
